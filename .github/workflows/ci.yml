name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test backend
        working-directory: backend
        run: |
          npm ci
          npm test
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
